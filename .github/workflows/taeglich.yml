name: Rechtsgrundlagen täglich prüfen

on:
  schedule:
    - cron: "23 4 * * *"   # täglich 05:23 MEZ / 06:23 MESZ
  workflow_dispatch: {}      # Knopf "Run workflow" für einen Lauf von Hand

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3 pyyaml==6.0.2

      - name: Volltexte laden und vergleichen
        run: python monitor.py

      - name: Ergebnis speichern
        run: |
          git config user.name "regulatory-monitor"
          git config user.email "regulatory-monitor@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Abgleich $(date +%F)"
            git push
          fi

      - name: Issue je geänderter Rechtsgrundlage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, subprocess
          lauf = json.load(open("letzter-lauf.json"))
          for a in lauf["aenderungen"]:
              body = open(a["datei"], encoding="utf-8").read()[:60000]
              subprocess.run(["gh", "issue", "create",
                              "--title", f"Neue Fassung: {a['name']} ({a['jetzt']})",
                              "--body", body], check=True)
          PY
